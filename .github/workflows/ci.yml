name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Caps the token for every workflow called below: a nested workflow can narrow it, never widen it.
permissions:
  contents: read

jobs:
  check:
    uses: 1mb-dev/.github/.github/workflows/ci-node.yml@main
    with:
      node-versions: '["22", "24", "26"]'
      run-build: false
      run-audit: false
