name: Probe

# Scheduled hourly (GitHub runs it every few hours), between deploys: a tokenless /_fetch must answer
# 403 token. A spent quota, a route that no longer reaches the Function, a broken deploy, or DNS turns
# it red. GitHub stops a public repo's schedule after 60 days without activity: the session-start
# check reads this workflow's last run.
# Stated in scripts/workflows.js (TABLE) as well.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/smoke.js --probe
