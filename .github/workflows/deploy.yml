name: Deploy

# Every key and value here but action commits and step names is also stated in scripts/workflows.js
# (TABLE); verify fails until both agree and test/golden/workflows.json is blessed.

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time, never cancelled mid-run: smoke settles on this build's bytes, so a newer deploy
# landing mid-run would redden a healthy site. A pending run is replaced by a newer push's.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Runs every dependency's code (tests, audit, build), so it holds no environment, secret, or id-token.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run audit
      - run: npm run site -- --deploy
        env:
          TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/site
          if-no-files-found: error
          retention-days: 1

  # Checks the artifact, then runs wrangler and smoke: the token is in the wrangler step's env alone.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/site
      - name: the artifact is what site.js writes
        run: node scripts/artifact.js dist/site
      - name: wrangler pages deploy
        run: node_modules/.bin/wrangler pages deploy dist/site --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - id: smoke
        run: node scripts/smoke.js
      - if: failure() && steps.smoke.outcome == 'failure'
        run: echo "::error::smoke failed after the deploy, so this build is live in production. Roll back in the dashboard (Workers & Pages > bareflow > Deployments) to the last green deployment."
